[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churn"
version = "1.0.0"
description = "Telco customer churn - supervised learning case study"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.5",
  "imbalanced-learn>=0.13",
  "xgboost>=2.1.4",
  "shap>=0.46",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "joblib>=1.3",
]

[project.optional-dependencies]
app = ["streamlit>=1.35"]
dev = ["jupyterlab>=4.0", "jupytext>=1.16", "nbconvert>=7.0", "ipykernel>=6.0", "pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
